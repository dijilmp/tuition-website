{% load static %}

<!DOCTYPE html>
<html>

<head>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Registration Form - Master X's Academy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            margin: 0;
            background:
                linear-gradient(rgba(6, 21, 54, 0.72), rgba(6, 21, 54, 0.72)),
                url("{% static 'images/study_bg.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .form-wrap {
            min-height: 100vh;
            padding: 30px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-card {
            width: 100%;
            max-width: 820px;
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.28);
            overflow: hidden;
        }

        .form-header {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: white;
            padding: 28px;
            text-align: center;
        }

        .form-body {
            padding: 30px;
        }

        .form-control,
        .form-select {
            border-radius: 13px;
            padding: 12px 14px;
        }

        .btn-register {
            border-radius: 13px;
            padding: 13px;
            font-weight: 800;
        }

    </style>

</head>

<body>

<div class="form-wrap">

    <div class="form-card">

        <div class="form-header">

            <img src="{% static 'images/logo.png' %}"
                 width="80"
                 height="80"
                 class="rounded-circle mb-3"
                 alt="Master X's Academy">

            <h2 class="fw-bold mb-1">
                Register for {{ training_label }}
            </h2>

            <p class="mb-0">
                Fill the details. Our team will contact you soon.
            </p>

        </div>

        <div class="form-body">

            <form method="post">

                {% csrf_token %}

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Student Name
                        </label>

                        <input type="text"
                               name="name"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Phone Number
                        </label>

                        <input type="tel"
                               name="phone_number"
                               class="form-control"
                               required>

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label fw-bold">
                        Address
                    </label>

                    <textarea name="address"
                              rows="3"
                              class="form-control"
                              required></textarea>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label fw-bold">
                            Class
                        </label>

                        <input type="text"
                               name="student_class"
                               class="form-control"
                               placeholder="Example: 9"
                               required>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label fw-bold">
                            Syllabus
                        </label>

                        <select name="syllabus"
                                id="syllabusSelect"
                                class="form-select"
                                required>

                            <option value="">
                                Select
                            </option>

                            <option value="state">
                                State
                            </option>

                            <option value="cbse">
                                CBSE
                            </option>

                            <option value="icse">
                                ICSE
                            </option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-3"
                         id="mediumBox"
                         style="display:none;">

                        <label class="form-label fw-bold">
                            Medium
                        </label>

                        <select name="medium"
                                id="mediumSelect"
                                class="form-select">

                            <option value="">
                                Select
                            </option>

                            <option value="english">
                                English
                            </option>

                            <option value="malayalam">
                                Malayalam
                            </option>

                            <option value="kannada">
                                Kannada
                            </option>

                            <option value="tamil">
                                Tamil
                            </option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label fw-bold">
                            Class Type
                        </label>

                        <select name="class_type"
                                class="form-select"
                                required>

                            <option value="">
                                Select
                            </option>

                            <option value="individual">
                                Individual
                            </option>

                            <option value="group">
                                Group
                            </option>

                        </select>

                    </div>

                </div>

                <div class="mb-4">

                    <label class="form-label fw-bold">
                        School Name
                    </label>

                    <input type="text"
                           name="school_name"
                           class="form-control"
                           required>

                </div>

                <button type="submit"
                        class="btn btn-success w-100 btn-register">

                    Register

                </button>

            </form>

            <div class="text-center mt-3">

                <a href="{% url 'register_training' %}"
                   class="text-decoration-none fw-bold">

                    Back to Training Selection

                </a>

            </div>

        </div>

    </div>

</div>

<script>

    const syllabusSelect = document.getElementById("syllabusSelect");
    const mediumBox = document.getElementById("mediumBox");
    const mediumSelect = document.getElementById("mediumSelect");

    function updateMediumVisibility() {

        if (syllabusSelect.value === "state") {

            mediumBox.style.display = "block";
            mediumSelect.required = true;

        } else {

            mediumBox.style.display = "none";
            mediumSelect.required = false;
            mediumSelect.value = "";

        }

    }

    syllabusSelect.addEventListener(
        "change",
        updateMediumVisibility
    );

    updateMediumVisibility();

</script>

</body>

</html>
